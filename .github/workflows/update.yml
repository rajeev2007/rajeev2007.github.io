name: Update Google Scholar Data

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly "bibtexparser<2.0.0"

      - name: Fetch stats for ID lWe4Q2UAAAAJ only
        run: |
          python - << 'EOF'
          import json
          from scholarly import scholarly, ProxyGenerator

          SCHOLAR_ID = 'lWe4Q2UAAAAJ'

          def fetch_profile(use_proxy=False):
              if use_proxy:
                  pg = ProxyGenerator()
                  pg.FreeProxies()
                  scholarly.use_proxy(pg)
              author = scholarly.search_author_id(SCHOLAR_ID)
              return scholarly.fill(author, sections=['indices', 'counts'])

          try:
              profile = fetch_profile(use_proxy=False)
          except Exception:
              profile = fetch_profile(use_proxy=True)

          cites_per_year = profile.get('cites_per_year', {})
          years = [str(y) for y in sorted(cites_per_year.keys())]
          counts = [int(cites_per_year[int(y)]) for y in years]

          if years and counts:
              data = {
                  'citations': str(profile.get('citedby', '289')),
                  'hIndex': str(profile.get('hindex', '12')),
                  'i10Index': str(profile.get('i10index', '13')),
                  'years': years,
                  'counts': counts
              }
              with open('data.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
              print('Updated data.json:', data)
          else:
              raise RuntimeError('Empty citation data returned')
          EOF

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Google Scholar citations" && git push)
