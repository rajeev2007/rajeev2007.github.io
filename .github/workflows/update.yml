name: Update Google Scholar Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Fetch Google Scholar stats and update data.json
        run: |
          python - << 'EOF'
          import json
          import requests
          from bs4 import BeautifulSoup

          urls = [
              'https://google.com',
              'https://google.com.tw',
              'https://google.de'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9'
          }

          updated = False
          for url in urls:
              try:
                  resp = requests.get(url, headers=headers, timeout=20)
                  if resp.status_code != 200:
                      continue
                  soup = BeautifulSoup(resp.text, 'html.parser')
                  stats_map = dict(enumerate(td.get_text(strip=True) for td in soup.select('#gsc_rsb_st td.gsc_rsb_std')))
                  years = [el.get_text(strip=True) for el in soup.select('.gsc_g_t')]
                  counts = [int(el.get_text(strip=True)) for el in soup.select('.gsc_g_al')]

                  if len(stats_map) >= 5 and years and counts:
                      data = {
                          'citations': stats_map.get(0),
                          'hIndex': stats_map.get(2),
                          'i10Index': stats_map.get(4),
                          'years': years,
                          'counts': counts
                      }
                      with open('data.json', 'w', encoding='utf-8') as f:
                          json.dump(data, f, indent=2)
                      print('Successfully updated data.json:', data)
                      updated = True
                      break
              except Exception as e:
                  print(f'Attempt failed for {url}: {e}')

          if not updated:
              print('Google Scholar rate-limited this runner IP; keeping existing data.json.')
          EOF

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Google Scholar citations" && git push)
