<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajeev Kumar Pandey - Google Scholar Citations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #scholar-widget {
      width: 100%;
      max-width: 480px;
      background: #1e1e1e;
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }
    .summary {
      font-size: 13.5px;
      line-height: 1.45;
      color: #e0e0e0;
    }
    .summary a {
      color: #64b5f6;
      text-decoration: none;
      font-weight: 600;
    }
    .summary a:hover {
      text-decoration: underline;
    }
    .metrics {
      margin-top: 2px;
    }
    .metrics .total {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .metrics .sub {
      font-size: 13px;
      color: #bdbdbd;
      margin-left: 4px;
    }
    .status {
      font-size: 11px;
      color: #81c784;
      white-space: nowrap;
      padding-top: 2px;
    }
    .chart-wrap {
      position: relative;
      width: 100%;
      height: 185px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="scholar-widget">
    <div class="header">
      <div class="summary" id="scholar-summary"></div>
      <span class="status" id="scholar-status">● Updated</span>
    </div>
    <div class="chart-wrap">
      <canvas id="scholarChart"></canvas>
    </div>
  </div>

  <script>
    (function () {
      const SCHOLAR_ID = 'lWe4Q2UAAAAJ';
      const TARGET_URL = `https://scholar.google.com.tw/citations?user=${SCHOLAR_ID}&hl=en`;

      const DEFAULT_DATA = {
        citations: '288',
        hIndex: '12',
        i10Index: '13',
        years: ['2020', '2021', '2022', '2023', '2024', '2025', '2026'],
        counts: [10, 36, 42, 40, 62, 55, 43]
      };

      let currentData = DEFAULT_DATA;
      let hoveredIndex = -1;

      function updateHeader(data, isSynced) {
        const summaryEl = document.getElementById('scholar-summary');
        const statusEl = document.getElementById('scholar-status');

        summaryEl.innerHTML = `
          Citations according to <a href="${TARGET_URL}" target="_blank" rel="noopener">Google Scholar</a>:
          <div class="metrics">
            <span class="total">${data.citations}</span>
            <span class="sub">(h-index: <strong>${data.hIndex}</strong>, i10-index: <strong>${data.i10Index}</strong>)</span>
          </div>
        `;

        statusEl.textContent = isSynced ? '● Auto-Synced' : '● Cached';
        statusEl.style.color = isSynced ? '#81c784' : '#9e9e9e';
      }

      function renderChart(data) {
        const canvas = document.getElementById('scholarChart');
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const padLeft = 32;
        const padRight = 10;
        const padTop = 22;
        const padBottom = 24;

        const chartW = width - padLeft - padRight;
        const chartH = height - padTop - padBottom;

        ctx.clearRect(0, 0, width, height);

        const maxVal = Math.max(...data.counts, 10);
        const step = Math.ceil(maxVal / 4 / 5) * 5 || 5;
        const topTick = step * 4;

        // Horizontal gridlines and Y-axis labels
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        for (let i = 0; i <= 4; i++) {
          const val = step * i;
          const y = padTop + chartH - (val / topTick) * chartH;

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(padLeft, y);
          ctx.lineTo(width - padRight, y);
          ctx.stroke();

          ctx.fillStyle = '#9e9e9e';
          ctx.fillText(val.toString(), padLeft - 6, y);
        }

        // Bars & X-axis labels
        const n = data.years.length;
        const slotW = chartW / n;
        const barW = Math.min(34, slotW * 0.62);

        canvas._bars = [];

        for (let i = 0; i < n; i++) {
          const count = data.counts[i] || 0;
          const barH = (count / topTick) * chartH;
          const x = padLeft + i * slotW + (slotW - barW) / 2;
          const y = padTop + chartH - barH;

          canvas._bars.push({ x, y, w: barW, h: barH, index: i });

          // Bar with rounded top corners
          const r = Math.min(4, barH / 2);
          ctx.fillStyle = (i === hoveredIndex) ? '#64b5f6' : '#757575';
          ctx.beginPath();
          ctx.moveTo(x, y + barH);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.lineTo(x + barW - r, y);
          ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
          ctx.lineTo(x + barW, y + barH);
          ctx.closePath();
          ctx.fill();

          // Value above bar
          ctx.fillStyle = (i === hoveredIndex) ? '#ffffff' : '#bdbdbd';
          ctx.font = (i === hoveredIndex) ? 'bold 11px sans-serif' : '11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(count.toString(), x + barW / 2, y - 4);

          // Year label below bar
          ctx.fillStyle = '#cccccc';
          ctx.font = '11px sans-serif';
          ctx.textBaseline = 'top';
          ctx.fillText(data.years[i], x + barW / 2, padTop + chartH + 6);
        }
      }

      const canvas = document.getElementById('scholarChart');
      canvas.addEventListener('mousemove', (e) => {
        if (!canvas._bars) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let found = -1;
        for (const b of canvas._bars) {
          if (mx >= b.x - 4 && mx <= b.x + b.w + 4 && my >= b.y - 16 && my <= b.y + b.h) {
            found = b.index;
            break;
          }
        }
        if (found !== hoveredIndex) {
          hoveredIndex = found;
          canvas.style.cursor = found !== -1 ? 'pointer' : 'default';
          renderChart(currentData);
        }
      });

      canvas.addEventListener('mouseleave', () => {
        if (hoveredIndex !== -1) {
          hoveredIndex = -1;
          canvas.style.cursor = 'default';
          renderChart(currentData);
        }
      });

      window.addEventListener('resize', () => renderChart(currentData));

      // Instant render first
      updateHeader(DEFAULT_DATA, false);
      renderChart(DEFAULT_DATA);

      // Load fresh data.json from repository if available
      fetch('./data.json?t=' + Date.now())
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(json => {
          if (json && json.citations && Array.isArray(json.years) && Array.isArray(json.counts)) {
            currentData = json;
            updateHeader(currentData, true);
            renderChart(currentData);
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
