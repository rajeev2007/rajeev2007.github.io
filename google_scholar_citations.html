<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajeev Kumar Pandey - Google Scholar Citations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    #scholar-widget {
      width: 100%;
      max-width: 480px;
      background: #1e1e1e;
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }
    .summary {
      font-size: 13.5px;
      line-height: 1.45;
    }
    .summary a {
      color: #64b5f6;
      text-decoration: none;
      font-weight: 600;
    }
    .summary a:hover {
      text-decoration: underline;
    }
    .metrics {
      margin-top: 2px;
    }
    .total-count {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .sub-metrics {
      font-size: 13px;
      color: #cccccc;
      margin-left: 6px;
    }
    .status {
      font-size: 11px;
      color: #9e9e9e;
      white-space: nowrap;
      padding-top: 2px;
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 185px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="scholar-widget">
    <div class="header">
      <div class="summary" id="scholar-summary"></div>
      <span class="status" id="scholar-status"></span>
    </div>
    <div class="chart-wrapper">
      <canvas id="scholarChart"></canvas>
    </div>
  </div>

  <script>
    (function () {
      const SCHOLAR_ID = 'lWe4Q2UAAAAJ';
      const LANG = 'en';
      const TARGET_URL = `https://scholar.google.com.tw/citations?user=${SCHOLAR_ID}&hl=${LANG}`;

      const FALLBACK_DATA = {
        citations: '288',
        hIndex: '12',
        i10Index: '13',
        years: ['2020', '2021', '2022', '2023', '2024', '2025', '2026'],
        counts: [10, 36, 42, 40, 62, 55, 43]
      };

      let currentData = FALLBACK_DATA;
      let hoveredIndex = -1;

      function renderWidget(data, isLive) {
        currentData = data;
        const summaryEl = document.getElementById('scholar-summary');
        const statusEl = document.getElementById('scholar-status');

        summaryEl.innerHTML = `
          <div>Citations according to <a href="${TARGET_URL}" target="_blank" rel="noopener">Google Scholar</a></div>
          <div class="metrics">
            <span class="total-count">${data.citations}</span>
            <span class="sub-metrics">(h-index: <strong>${data.hIndex}</strong>, i10-index: <strong>${data.i10Index}</strong>)</span>
          </div>
        `;

        statusEl.textContent = isLive ? '● Live' : '● Verified';
        statusEl.style.color = isLive ? '#81c784' : '#9e9e9e';

        drawBarChart();
      }

      function drawBarChart() {
        const canvas = document.getElementById('scholarChart');
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const padLeft = 32;
        const padRight = 10;
        const padTop = 18;
        const padBottom = 24;

        const plotW = width - padLeft - padRight;
        const plotH = height - padTop - padBottom;

        ctx.clearRect(0, 0, width, height);

        const counts = currentData.counts;
        const years = currentData.years;
        const maxVal = Math.max(...counts, 10);
        const yMax = Math.ceil(maxVal / 10) * 10;

        // Horizontal grid lines & Y-axis labels
        ctx.font = '11px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        const gridSteps = 3;
        for (let i = 0; i <= gridSteps; i++) {
          const val = Math.round((yMax / gridSteps) * i);
          const y = padTop + plotH - (plotH * (val / yMax));

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(padLeft, y);
          ctx.lineTo(width - padRight, y);
          ctx.stroke();

          ctx.fillStyle = '#9e9e9e';
          ctx.fillText(val, padLeft - 6, y);
        }

        // Bars & X-axis labels
        const n = years.length;
        const slotW = plotW / n;
        const barW = Math.min(34, slotW * 0.58);

        years.forEach((year, idx) => {
          const count = counts[idx];
          const barH = (count / yMax) * plotH;
          const x = padLeft + idx * slotW + (slotW - barW) / 2;
          const y = padTop + plotH - barH;

          // Bar fill
          ctx.fillStyle = idx === hoveredIndex ? '#64b5f6' : '#757575';
          ctx.beginPath();
          ctx.roundRect(x, y, barW, barH, [4, 4, 0, 0]);
          ctx.fill();

          // Value label above bar
          ctx.fillStyle = idx === hoveredIndex ? '#ffffff' : '#bdbdbd';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.font = idx === hoveredIndex ? 'bold 11px Arial, sans-serif' : '10.5px Arial, sans-serif';
          ctx.fillText(count, x + barW / 2, y - 3);

          // Year label below axis
          ctx.fillStyle = '#cccccc';
          ctx.textBaseline = 'top';
          ctx.font = '11px Arial, sans-serif';
          ctx.fillText(year, x + barW / 2, padTop + plotH + 6);
        });
      }

      // Hover interactivity
      const canvasEl = document.getElementById('scholarChart');
      canvasEl.addEventListener('mousemove', (e) => {
        const rect = canvasEl.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const padLeft = 32;
        const padRight = 10;
        const plotW = rect.width - padLeft - padRight;
        const slotW = plotW / currentData.years.length;
        const idx = Math.floor((mouseX - padLeft) / slotW);

        const newHover = (idx >= 0 && idx < currentData.years.length) ? idx : -1;
        if (newHover !== hoveredIndex) {
          hoveredIndex = newHover;
          drawBarChart();
        }
      });

      canvasEl.addEventListener('mouseleave', () => {
        if (hoveredIndex !== -1) {
          hoveredIndex = -1;
          drawBarChart();
        }
      });

      window.addEventListener('resize', drawBarChart);

      // 1. Render IMMEDIATELY (0ms delay) using verified data
      renderWidget(FALLBACK_DATA, false);

      // 2. Silently check for live updates in the background with a strict 2.5s timeout
      async function refreshInBackground() {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}`;

        try {
          const response = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (!response.ok) return;

          const json = await response.json();
          if (!json.contents) return;

          const parser = new DOMParser();
          const doc = parser.parseFromString(json.contents, 'text/html');

          const statCells = doc.querySelectorAll('#gsc_rsb_st td.gsc_rsb_std');
          const years = Array.from(doc.querySelectorAll('.gsc_g_t')).map(el => el.textContent.trim());
          const counts = Array.from(doc.querySelectorAll('.gsc_g_al')).map(el => parseInt(el.textContent.trim(), 10));

          if (!statCells.length || !years.length) return;

          renderWidget({
            citations: statCells[0].textContent.trim(),
            hIndex: statCells[2] ? statCells[2].textContent.trim() : FALLBACK_DATA.hIndex,
            i10Index: statCells[4] ? statCells[4].textContent.trim() : FALLBACK_DATA.i10Index,
            years,
            counts
          }, true);
        } catch (err) {
          // Keep instant cached chart if proxy is slow or blocked
        }
      }

      refreshInBackground();
    })();
  </script>
</body>
</html>
